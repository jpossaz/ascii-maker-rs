<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ascii-maker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0d1117;
            color: #f0f6fc;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 6px;
            color: #58a6ff;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
        }

        .tagline {
            text-align: center;
            color: #7d8590;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .controls {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .file-label {
            display: block;
            padding: 12px 24px;
            background: #21262d;
            border: 2px dashed #30363d;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .file-label:hover {
            border-color: #58a6ff;
            background: #0d1117;
        }

        .file-label.has-file {
            border-style: solid;
            border-color: #238636;
            background: #0d1521;
        }

        .settings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
            align-items: start;
        }

        .card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #58a6ff;
            font-weight: 700;
        }

        .card label:not(.check) {
            font-size: 13px;
            font-weight: 600;
        }

        .sub {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 2px solid #30363d;
            padding-left: 12px;
        }

        .disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group > label,
        .setting-group > .group-title {
            font-size: 14px;
            font-weight: 600;
        }

        .setting-group.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .hint {
            font-size: 11px;
            color: #7d8590;
            font-weight: normal;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #30363d;
            border-radius: 3px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #58a6ff;
            border-radius: 50%;
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #58a6ff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .slider-value {
            min-width: 42px;
            text-align: right;
            font-weight: bold;
            color: #58a6ff;
        }

        select {
            background: #0d1117;
            color: #f0f6fc;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        .checks {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        .check input {
            accent-color: #238636;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn {
            padding: 10px 18px;
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }

        .btn:hover:not(:disabled) {
            border-color: #58a6ff;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .process-btn {
            width: 100%;
            padding: 12px 24px;
            background: #238636;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .process-btn:hover:not(:disabled) {
            background: #2ea043;
        }

        .process-btn:disabled {
            background: #30363d;
            color: #7d8590;
        }

        .output-container {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }

        .output-header {
            background: #161b22;
            padding: 10px 16px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .output-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .progress-info {
            font-size: 12px;
            color: #7d8590;
        }

        .ascii-output {
            padding: 16px;
            overflow: auto;
            max-height: 70vh;
            background: #181818;
        }

        .ascii-output pre {
            font-family: 'Courier New', monospace;
            font-size: 7px;
            line-height: 1.2;
            white-space: pre;
            margin: 0;
            color: #f0f6fc;
        }

        .error {
            color: #f85149;
            border: 1px solid #f85149;
            border-radius: 6px;
            padding: 16px;
            margin: 16px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .settings {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>ascii-maker</h1>
        <p class="tagline">Every 10&times;20 block is matched against every glyph and colour pair.</p>

        <div class="controls">
            <input type="file" id="fileInput" class="file-input" accept="image/*">
            <label for="fileInput" class="file-label" id="fileLabel">
                Click to select an image or drag &amp; drop
            </label>

            <div class="settings">
                <section class="card">
                    <h2>Output</h2>
                    <label for="colsSlider">Columns</label>
                    <div class="slider-container">
                        <input type="range" id="colsSlider" class="slider" min="20" max="300" value="100">
                        <span class="slider-value" id="colsValue">100</span>
                    </div>
                    <label for="sizeSlider">Display size</label>
                    <div class="slider-container">
                        <input type="range" id="sizeSlider" class="slider" min="3" max="20" value="7">
                        <span class="slider-value" id="sizeValue">7px</span>
                    </div>
                </section>

                <section class="card">
                    <h2>Base layer</h2>
                    <label for="baseColor">Colours</label>
                    <select id="baseColor">
                        <option value="mono">Monochrome</option>
                        <option value="gray">Grayscale</option>
                        <option value="color" selected>Full 16 colours</option>
                    </select>
                    <div class="checks">
                        <label class="check"><input type="checkbox" id="baseBackground"> Colour the background
                            too</label>
                        <label class="check"><input type="checkbox" id="baseInvert"> Invert colours</label>
                        <label class="check"><input type="checkbox" id="baseInvertLightness"> Invert lightness
                            <span class="hint">(keeps hue)</span></label>
                        <label class="check"><input type="checkbox" id="baseEdge"> Match on edges</label>
                    </div>
                    <div class="sub disabled" id="baseEdgeSub">
                        <label for="baseEdgeGain">Edge gain</label>
                        <div class="slider-container">
                            <input type="range" id="baseEdgeGain" class="slider" min="0.2" max="4" step="0.1"
                                value="1.5">
                            <span class="slider-value" id="baseEdgeGainValue">1.5</span>
                        </div>
                    </div>
                </section>

                <section class="card">
                    <h2>Edge overlay</h2>
                    <label class="check"><input type="checkbox" id="overlayOn"> Draw an edge layer on top</label>
                    <span class="hint">A second pass, always matched on edges. Wherever it produces a space, the
                        base layer shows through.</span>
                    <div class="sub disabled" id="overlaySub">
                        <label for="overlayColor">Colours</label>
                        <select id="overlayColor">
                            <option value="mono" selected>Monochrome</option>
                            <option value="gray">Grayscale</option>
                            <option value="color">Full 16 colours</option>
                        </select>
                        <div class="checks">
                            <label class="check"><input type="checkbox" id="overlayInvert"> Invert colours</label>
                            <label class="check"><input type="checkbox" id="overlayInvertLightness"> Invert
                                lightness</label>
                        </div>
                        <label for="overlayEdgeGain">Edge gain</label>
                        <div class="slider-container">
                            <input type="range" id="overlayEdgeGain" class="slider" min="0.2" max="4" step="0.1"
                                value="1.5">
                            <span class="slider-value" id="overlayEdgeGainValue">1.5</span>
                        </div>
                        <label for="overlayBackground">Background comes from</label>
                        <select id="overlayBackground">
                            <option value="own" selected>The overlay (black)</option>
                            <option value="base">The layer below</option>
                        </select>
                    </div>
                </section>
            </div>

            <button id="processBtn" class="btn process-btn" disabled>Select an image to convert</button>
        </div>

        <div class="output-container">
            <div class="output-header">
                <span class="progress-info" id="progressInfo">Ready</span>
                <div class="output-actions">
                    <button class="btn" id="copyText" disabled>Copy text</button>
                    <button class="btn" id="copyAnsi" disabled>Copy ANSI</button>
                    <button class="btn" id="copyHtml" disabled>Copy HTML</button>
                </div>
            </div>
            <div class="ascii-output" id="outputWrap">
                <pre id="output"></pre>
            </div>
        </div>
    </div>

    <script>
        const worker = new Worker('./worker.js', { type: 'module' });

        const el = (id) => document.getElementById(id);
        const fileInput = el('fileInput');
        const fileLabel = el('fileLabel');
        const processBtn = el('processBtn');
        const colsSlider = el('colsSlider');
        const sizeSlider = el('sizeSlider');
        const output = el('output');
        const outputWrap = el('outputWrap');
        const progressInfo = el('progressInfo');

        // Filled in by the worker once wasm is up; falls back to the values the
        // stamps were rendered against.
        let palette = [
            '#181818', '#b13c3d', '#78b13c', '#b1943c', '#3c48b1', '#963cb1', '#42a89c', '#cfcfcf',
            '#4f4f4f', '#ff5658', '#adff56', '#ffd556', '#5668ff', '#d856ff', '#64ffef', '#ffffff',
        ];

        let imageData = null;
        let imageName = '';
        let busy = false;
        let rowHtml = [];
        let result = null;

        // --- input -----------------------------------------------------------

        async function loadFile(file) {
            if (!file || busy) return;
            try {
                imageData = new Uint8Array(await file.arrayBuffer());
                imageName = file.name;
                fileLabel.textContent = `Selected: ${file.name}`;
                fileLabel.classList.add('has-file');
                processBtn.disabled = false;
                processBtn.textContent = `Convert ${file.name}`;
                progressInfo.textContent = 'Ready';
            } catch (error) {
                showError('Failed to read file: ' + error.message);
            }
        }

        fileInput.addEventListener('change', (e) => loadFile(e.target.files[0]));

        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!busy) fileLabel.style.borderColor = '#58a6ff';
        });
        fileLabel.addEventListener('dragleave', () => {
            fileLabel.style.borderColor = '';
        });
        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.style.borderColor = '';
            loadFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('click', (e) => {
            if (busy) e.preventDefault();
        });

        // --- controls --------------------------------------------------------

        colsSlider.addEventListener('input', () => {
            el('colsValue').textContent = colsSlider.value;
        });
        sizeSlider.addEventListener('input', () => {
            el('sizeValue').textContent = sizeSlider.value + 'px';
            output.style.fontSize = sizeSlider.value + 'px';
        });
        for (const id of ['baseEdgeGain', 'overlayEdgeGain']) {
            el(id).addEventListener('input', () => {
                el(id + 'Value').textContent = Number(el(id).value).toFixed(1);
            });
        }

        // Each layer's extra settings only matter once that layer is switched on.
        for (const [toggle, section] of [['baseEdge', 'baseEdgeSub'], ['overlayOn', 'overlaySub']]) {
            el(toggle).addEventListener('change', () => {
                el(section).classList.toggle('disabled', !el(toggle).checked);
            });
        }

        /** Read one layer's controls, which all share an id prefix. */
        function readLayer(prefix) {
            return {
                color: el(prefix + 'Color').value,
                invert: el(prefix + 'Invert').checked,
                invertLightness: el(prefix + 'InvertLightness').checked,
                edgeGain: parseFloat(el(prefix + 'EdgeGain').value),
            };
        }

        processBtn.addEventListener('click', () => {
            if (!imageData || busy) return;
            startRun();
            worker.postMessage({
                data: imageData,
                options: {
                    cols: parseInt(colsSlider.value, 10),
                    base: {
                        ...readLayer('base'),
                        background: el('baseBackground').checked,
                        edge: el('baseEdge').checked,
                    },
                    // The overlay's edge matching and lack of background are
                    // fixed on the Rust side; these are the settings that vary.
                    overlay: el('overlayOn').checked ? readLayer('overlay') : null,
                    overlayBackground: el('overlayBackground').value,
                },
            });
        });

        // --- rendering -------------------------------------------------------

        const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };

        /** Build one row of markup from `char, fg, bg` triples, merging runs. */
        function renderRow(triples) {
            let html = '';
            let run = null;
            let text = '';
            for (let i = 0; i < triples.length; i += 3) {
                const ch = String.fromCharCode(triples[i]);
                const key = triples[i + 1] * 16 + triples[i + 2];
                if (key !== run) {
                    if (run !== null) html += escapeHtml(text) + '</span>';
                    html += `<span style="color:${palette[triples[i + 1]]};background:${palette[triples[i + 2]]}">`;
                    run = key;
                    text = '';
                }
                text += ch;
            }
            if (run !== null) html += escapeHtml(text) + '</span>';
            return html;
        }

        function escapeHtml(s) {
            return s.replace(/[&<>]/g, (c) => escapeMap[c]);
        }

        function startRun() {
            busy = true;
            rowHtml = [];
            result = null;
            output.innerHTML = '';
            clearError();
            processBtn.disabled = true;
            processBtn.textContent = 'Converting...';
            fileInput.disabled = true;
            for (const id of ['copyText', 'copyAnsi', 'copyHtml']) el(id).disabled = true;
            progressInfo.textContent = 'Converting...';
        }

        function finishRun(message) {
            busy = false;
            processBtn.disabled = !imageData;
            processBtn.textContent = imageData ? `Convert ${imageName}` : 'Select an image to convert';
            fileInput.disabled = false;
            progressInfo.textContent = message;
        }

        function showError(message) {
            clearError();
            const box = document.createElement('div');
            box.className = 'error';
            box.id = 'errorBox';
            box.textContent = 'Error: ' + message;
            outputWrap.parentNode.appendChild(box);
            finishRun('Failed');
        }

        function clearError() {
            const box = el('errorBox');
            if (box) box.remove();
        }

        worker.onmessage = (e) => {
            const msg = e.data;
            switch (msg.type) {
                case 'palette':
                    palette = msg.palette;
                    break;

                case 'row':
                    rowHtml.push(renderRow(msg.triples));
                    // Repainting every row gets expensive on tall output; a
                    // batch every 8 rows still looks continuous.
                    if (msg.row % 8 === 0 || msg.row + 1 >= msg.total) {
                        output.innerHTML = rowHtml.join('\n');
                        progressInfo.textContent =
                            `Converting... ${Math.round(((msg.row + 1) / msg.total) * 100)}%`;
                    }
                    break;

                case 'done':
                    output.innerHTML = rowHtml.join('\n');
                    result = msg;
                    for (const id of ['copyText', 'copyAnsi', 'copyHtml']) el(id).disabled = false;
                    finishRun(`${msg.cols} x ${msg.rows} characters`);
                    break;

                case 'error':
                    showError(msg.error);
                    break;
            }
        };

        worker.onerror = (error) => showError(error.message || 'worker failed to start');

        // --- copy ------------------------------------------------------------

        async function copy(button, text) {
            const label = button.textContent;
            try {
                await navigator.clipboard.writeText(text);
                button.textContent = 'Copied';
            } catch {
                button.textContent = 'Copy failed';
            }
            setTimeout(() => { button.textContent = label; }, 1200);
        }

        el('copyText').addEventListener('click', (e) => copy(e.target, result.text));
        el('copyAnsi').addEventListener('click', (e) => copy(e.target, result.ansi));
        el('copyHtml').addEventListener('click', (e) => copy(e.target, output.innerHTML));

        output.style.fontSize = sizeSlider.value + 'px';
    </script>
</body>

</html>
